<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hodor</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #0d0d0d;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .main {
      text-align: center;
      padding: 40px 24px;
    }
    .logo {
      font-size: 120px;
      font-weight: 900;
      letter-spacing: 0.08em;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 8px;
      animation: fadeIn 1.2s ease;
    }
    .tagline {
      font-size: 18px;
      color: #888;
      letter-spacing: 0.2em;
      margin-bottom: 48px;
      animation: fadeIn 1.6s ease;
    }
    .links {
      display: flex;
      gap: 24px;
      justify-content: center;
      flex-wrap: wrap;
      animation: fadeIn 2s ease;
    }
    .link-card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px;
      padding: 20px 28px;
      min-width: 160px;
      text-decoration: none;
      color: #ccc;
      transition: all 0.3s ease;
    }
    .link-card:hover {
      background: rgba(255,255,255,0.08);
      border-color: rgba(102, 126, 234, 0.4);
      transform: translateY(-2px);
      color: #fff;
    }
    .link-card .icon {
      font-size: 32px;
      margin-bottom: 8px;
    }
    .link-card .label {
      font-size: 14px;
      letter-spacing: 0.05em;
    }
    .footer {
      position: fixed;
      bottom: 24px;
      width: 100%;
      text-align: center;
      font-size: 12px;
      color: #444;
      animation: fadeIn 2.4s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <div class="main">
    <div class="logo">HODOR</div>
    <div class="tagline">hold the door</div>
    <div class="links">
      <a class="link-card" href="https://github.com" target="_blank">
        <div class="icon">&#128187;</div>
        <div class="label">GitHub</div>
      </a>
      <a class="link-card" href="#" target="_blank">
        <div class="icon">&#128640;</div>
        <div class="label">App</div>
      </a>
      <a class="link-card" href="#" target="_blank">
        <div class="icon">&#9993;&#65039;</div>
        <div class="label">Contact</div>
      </a>
    </div>
  </div>
  <div class="footer">hodor.github.io</div>
</body>
</html>
